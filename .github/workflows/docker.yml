name: Build & Push Docker image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/lsiparis/thor:latest
            ghcr.io/lsiparis/thor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy via Portainer
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.PORTAINER_URL }}/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.PORTAINER_USER }}\",\"password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")

          COMPOSE=$(curl -s "${{ secrets.PORTAINER_URL }}/api/stacks/103/file" \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['StackFileContent'])")

          ENV=$(curl -s "${{ secrets.PORTAINER_URL }}/api/stacks/103" \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('Env') or []))")

          PAYLOAD=$(python3 -c "
          import json, sys
          compose = open('/dev/stdin').read()
          env = json.loads('$ENV')
          print(json.dumps({'StackFileContent': compose, 'Env': env, 'PullImage': True}))
          " <<< "$COMPOSE")

          RESULT=$(curl -s -X PUT "${{ secrets.PORTAINER_URL }}/api/stacks/103?endpointId=13" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Status:', d.get('Status'), '| Name:', d.get('Name'))"
