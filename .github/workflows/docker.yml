name: Build & Push Docker image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/lsiparis/thor:latest
            ghcr.io/lsiparis/thor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy via Portainer
        run: |
          TOKEN=$(curl -s -X POST "${{ secrets.PORTAINER_URL }}/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.PORTAINER_USER }}\",\"password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}" \
            | jq -r '.jwt')

          STACK=$(curl -s -X GET "${{ secrets.PORTAINER_URL }}/api/stacks/103" \
            -H "Authorization: Bearer $TOKEN")

          COMPOSE=$(echo "$STACK" | jq -r '.StackFileContent')
          ENV=$(echo "$STACK" | jq '.Env // []')

          curl -s -X PUT "${{ secrets.PORTAINER_URL }}/api/stacks/103?endpointId=13" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"StackFileContent\":$(echo "$COMPOSE" | jq -Rs .),\"Env\":$ENV,\"PullImage\":true}" \
            | jq '{status: .Status, updated: .UpdateDate}'
