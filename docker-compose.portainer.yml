# ──────────────────────────────────────────────────────────────────────────────
# LSI Maintenance — Client Portal
# Stack Portainer — image pré-construite, aucun build requis
#
# Prérequis (une seule fois sur le serveur) :
#   docker network create proxy
#   (NPM doit également être sur le réseau "proxy")
#
# Variables à définir dans Portainer → Stacks → Env :
#   Obligatoires :
#     POSTGRES_PASSWORD   mot de passe PostgreSQL (ex: openssl rand -hex 24)
#     NEXTAUTH_SECRET     secret NextAuth (ex: openssl rand -base64 32)
#     NEXTAUTH_URL        URL publique, ex: https://dashboard.lsi-maintenance.fr
#     ENCRYPTION_KEY      clé AES-256 hex (ex: openssl rand -hex 32)
#     CRON_SECRET         token cron (ex: openssl rand -hex 24)
#   Optionnelles :
#     MAILGUN_API_KEY / MAILGUN_DOMAIN / MAILGUN_FROM / LSI_NOTIFY_EMAIL
#     DESK365_SUBDOMAIN / DESK365_API_KEY
#     COMET_SERVER_URL / COMET_ADMIN_USER / COMET_ADMIN_PASS
#     AXONAUT_API_KEY
#     DOCUSEAL_API_KEY / DOCUSEAL_API_URL / DOCUSEAL_WEBHOOK_SECRET
#     RMM_BASE_URL / RMM_API_KEY
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de données ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lsi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: lsi_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsi"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lsi_net

  # ── Application Next.js ───────────────────────────────────────────────────────
  app:
    image: ghcr.io/lsiparis/thor:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lsi:${POSTGRES_PASSWORD}@postgres:5432/lsi_portal?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      CRON_SECRET: ${CRON_SECRET:?}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      LSI_NOTIFY_EMAIL: ${LSI_NOTIFY_EMAIL:-contact@lsi-maintenance.fr}
      DESK365_SUBDOMAIN: ${DESK365_SUBDOMAIN:-}
      DESK365_API_KEY: ${DESK365_API_KEY:-}
      COMET_SERVER_URL: ${COMET_SERVER_URL:-}
      COMET_ADMIN_USER: ${COMET_ADMIN_USER:-}
      COMET_ADMIN_PASS: ${COMET_ADMIN_PASS:-}
      AXONAUT_API_KEY: ${AXONAUT_API_KEY:-}
      DOCUSEAL_API_KEY: ${DOCUSEAL_API_KEY:-}
      DOCUSEAL_API_URL: ${DOCUSEAL_API_URL:-https://api.docuseal.eu}
      DOCUSEAL_WEBHOOK_SECRET: ${DOCUSEAL_WEBHOOK_SECRET:-}
      RMM_BASE_URL: ${RMM_BASE_URL:-}
      RMM_API_KEY: ${RMM_API_KEY:-}
    volumes:
      - uploads:/app/public/uploads
      - handovers:/app/public/handovers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/auth/csrf"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lsi_net
      - proxy   # réseau partagé avec NPM pour le reverse-proxy

  # ── Tâches planifiées ─────────────────────────────────────────────────────────
  cron:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: http://app:3000
    entrypoint:
      - sh
      - -c
      - |
        printf '%s\n' \
          "*/15 * * * * wget -qO- $$APP_URL/api/cron/check-movements?secret=$$CRON_SECRET >> /var/log/cron.log 2>&1" \
          "0 2,14 * * * wget -qO- $$APP_URL/api/cron/sync-m365?secret=$$CRON_SECRET >> /var/log/cron.log 2>&1" \
          | crontab - && crond -f -d 8
    depends_on:
      - app
    networks:
      - lsi_net

volumes:
  postgres_data:
  uploads:
  handovers:

networks:
  lsi_net:
    driver: bridge
  proxy:
    external: true   # créé manuellement une fois : docker network create proxy
